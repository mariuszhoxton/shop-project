services:
  nginx:
    image: nginx:latest
    container_name: shop_proxy
    restart: always
    ports:
      - "80:80"  
      - "443:443"  
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro  
    depends_on:
      - wordpress
      - metabase    # Nginx czeka na uruchomienie analityki
      - portainer   # Nginx czeka na uruchomienie Portainera
    networks:
      - frontend_public
      - proxy_analytics  # Bezpieczna sieć do Metabase
      - proxy_portainer  # Bezpieczna sieć do Portainera

  db:
    image: mariadb:10.6
    container_name: shop_database
    restart: always
    networks:
      - backend_internal  
      - analytics_net  
    environment:
      MYSQL_DATABASE: wordpress_db
      MYSQL_USER: wp_user
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:latest
    container_name: shop_frontend  
    restart: always
    depends_on:
      - db
    networks:
      - frontend_public
      - backend_internal
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp_user
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: wordpress_db
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - wp_data:/var/www/html

  certbot:
    image: certbot/certbot
    container_name: shop_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --disable-hook-validation --deploy-hook \"docker kill -s HUP shop_proxy\"; sleep 12h & wait $${!}; done;'"
    networks:
      - frontend_public

  metabase:
    image: metabase/metabase:latest
    container_name: shop_analytics
    restart: always
    # ports:
    #   - "3000:3000" # ZAKOMENTOWANO - odcięte od świata
    environment:
      - MB_DB_TYPE=h2  
      - MB_DB_FILE=/metabase-data/metabase.db 
      - MB_SITE_URL=http://192.168.56.11/metabase  # Informuje Metabase o nowej ścieżki www
    volumes:
      - metabase_data:/metabase-data 
    networks:
      - proxy_analytics   # Połączenie tylko z Nginxem
      - analytics_net  

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    # ports:
    #   - "9000:9000" # ZAKOMENTOWANO - odcięte od świata
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - proxy_portainer # Połączenie tylko z Nginxem
    command: --base-url=/portainer/  # Informuje Portainera o nowej ścieżce www

networks:
  frontend_public:
  backend_internal:
    internal: true
  analytics_net:         
    internal: true       
  proxy_analytics:       
    internal: true
  proxy_portainer:       
    internal: true
  
volumes:
  db_data:
  wp_data:
  metabase_data:
  portainer_data:        # USUNIĘTO external: true oraz name! Docker sam stworzy czysty wolumen
