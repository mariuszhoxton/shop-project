server {
    listen 80;
    server_name localhost;

    # Automatyczne przekierowanie z HTTP na HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    # Ścieżki do certyfikatów (zgodne z tym, co zamapujemy w Dockerze)
    ssl_certificate /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

    # Podstawowa optymalizacja SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 64M;

    # --- 1. SKLEP WORDPRESS ---
    location / {
        proxy_pass http://shop_frontend:80; # Używamy nazwy kontenera z nowego Compose
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- 2. PANEL METABASE (NOWOŚĆ!) ---
    location /metabase/ {
        proxy_pass http://shop_analytics:3000; # Używamy nazwy kontenera z nowego Compose, ukośnik na końcu odcina /metabase/
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- 3. PANEL PORTAINER (NOWOŚĆ!) ---
    location /portainer/ {
        proxy_pass http://portainer:9000; # Używamy nazwy kontenera z nowego Compose, ukośnik na końcu odcina /portainer/
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
